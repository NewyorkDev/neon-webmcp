    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["01-returning-hook"] = tl;

        const fullText = "My usual haircut on the 3rd around lunch";
        const textEl = document.getElementById("f01-returning-hook-text");
        const cursorEl = document.getElementById("f01-returning-hook-cursor");
        const typeDriver = { length: 0 };
        const blinkDriver = { phase: 0 };

        tl.fromTo("#f01-returning-hook-prompt", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 0.02);
        tl.fromTo(".f01-returning-hook-kicker", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0.12);
        tl.to(typeDriver, {
          length: fullText.length,
          duration: 2.72,
          ease: "none",
          onUpdate: () => {
            textEl.textContent = fullText.slice(0, Math.floor(typeDriver.length));
          }
        }, 0.28);
        tl.to(blinkDriver, {
          phase: Math.PI * 2 * 10,
          duration: 8,
          ease: "none",
          onUpdate: () => {
            const typing = typeDriver.length > 0 && typeDriver.length < fullText.length;
            cursorEl.style.opacity = typing || Math.sin(blinkDriver.phase) > 0 ? "1" : "0";
            const n = Math.floor(typeDriver.length);
            cursorEl.style.background = n >= 35 ? "#7BA900" : n >= 22 ? "#6820FF" : "#915DFF";
          }
        }, 0);

        tl.fromTo("#f01-returning-hook-chip-usual", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 3.28);
