<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFDF8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="75"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-returning-hook"
        class="scene"
        data-composition-id="01-returning-hook"
        data-composition-src="compositions/frames/01-returning-hook.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="el-02-history-shortcut"
        class="scene"
        data-composition-id="02-history-shortcut"
        data-composition-src="compositions/frames/02-history-shortcut.html"
        data-start="8"
        data-duration="12"
        data-track-index="1"
      ></div>

      <div
        id="el-03-provider-evidence"
        class="scene"
        data-composition-id="03-provider-evidence"
        data-composition-src="compositions/frames/03-provider-evidence.html"
        data-start="20"
        data-duration="12"
        data-track-index="1"
      ></div>

      <div
        id="el-04-three-winners"
        class="scene"
        data-composition-id="04-three-winners"
        data-composition-src="compositions/frames/04-three-winners.html"
        data-start="32"
        data-duration="16"
        data-track-index="1"
      ></div>

      <div
        id="el-05-new-provider-tradeoff"
        class="scene"
        data-composition-id="05-new-provider-tradeoff"
        data-composition-src="compositions/frames/05-new-provider-tradeoff.html"
        data-start="48"
        data-duration="12"
        data-track-index="1"
      ></div>

      <div
        id="el-06-booking-proof"
        class="scene"
        data-composition-id="06-booking-proof"
        data-composition-src="compositions/frames/06-booking-proof.html"
        data-start="60"
        data-duration="15"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
